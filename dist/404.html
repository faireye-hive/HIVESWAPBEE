<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HiveSwapBee</title>
    <script>
      // GitHub Pages has no SPA fallback. Unknown paths, including ones with a
      // dot such as /trade/SWAP.BTC, land here. Send the visitor back to the
      // app entry and keep the real path in the query string. index.html
      // restores it with history.replaceState before React Router starts.
      // pathSegmentsToKeep is 1 because the site is a project page:
      // https://<user>.github.io/HIVESWAPBEE/
      var pathSegmentsToKeep = 1;
      var location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body></body>
</html>
